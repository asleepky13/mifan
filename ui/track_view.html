<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; font-family: 'JetBrains Mono', monospace; color: #000; background: #fff; }
  .hud { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: #000; color: #fff; }
  /* Fixed height, no wrapping: changing numbers can never resize the HUD and shift the map. */
  .hud > div { height: 74px; padding: .65rem .8rem; border-right: 1px solid #333; overflow: hidden; }
  .hud span { display: block; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: #BDBDBD; white-space: nowrap; }
  .hud b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(.95rem, 2.4vw, 1.6rem); font-weight: 700;
    margin-top: .3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums lining-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; padding: .6rem 0; align-items: center; }
  button, select { font-family: inherit; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase;
    background: #000; color: #fff; border: 2px solid #000; padding: .55rem 1rem; min-height: 40px; cursor: pointer; }
  button:hover { background: #fff; color: #000; }
  select { background: #fff; color: #000; }
  button:focus-visible, select:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
  label { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; margin-left: .5rem; }
  canvas { display: block; width: 100%; height: auto; border: 1px solid #000; }
  .tyre { height: 4px; background: #333; margin-top: .35rem; }
  .tyre i { display: block; height: 100%; background: #fff; }
  .tyre i.low { background: #ff5a36; }
  @media (max-width: 640px) { .hud { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="hud">
  <div><span>Speed</span><b id="speed">0</b></div>
  <div><span>Lap</span><b id="lap">1</b></div>
  <div><span>Lap time</span><b id="laptime">0.00</b></div>
  <div><span>Last lap</span><b id="last">—</b></div>
  <div><span id="tyrename">Tyres</span><b id="tyres">100%</b><div class="tyre"><i id="tyrebar" style="width:100%"></i></div></div>
  <div><span>Status</span><b id="status">Ready</b></div>
  <div><span>Weather</span><b id="weather">—</b></div>
</div>
<div class="controls">
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="reset">Reset</button>
  <label for="mult">Sim speed</label>
  <select id="mult"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>
  <label for="view">View</label>
  <select id="view"><option value="overview">Overview</option><option value="follow">Follow car</option></select>
</div>
<canvas id="c" aria-label="Top-down track view"></canvas>
<script>
const S = __SCENE__;
const F = S.frames, T = S.track, W = S.view.w, H = S.view.h, wet = S.weather.rain;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr; cv.height = H * dpr;

function path(p, close) {
  const out = new Path2D();
  out.moveTo(p.x[0], p.y[0]);
  for (let i = 1; i < p.x.length; i++) out.lineTo(p.x[i], p.y[i]);
  if (close) out.closePath();
  return out;
}
// Ground, verge and tree colours for each environment; wet darkens them.
const THEME = {
  parkland: { ground: '#3f7a36', stripe: '#47843d', verge: '#2f5f28', tree: '#24451f', crown: '#356b2b' },
  forest: { ground: '#2c5426', stripe: null, verge: '#264a21', tree: '#132e14', crown: '#1f4a22' },
  harbour: { ground: '#b5b0a6', stripe: null, verge: '#8f8b83', tree: '#2c5a2a', crown: '#3e7a36' },
  desert: { ground: '#dcc28f', stripe: null, verge: '#c9ad78', tree: '#4f6b26', crown: '#7a9a38' },
}[S.environment] || {};
const shade = c => { if (!wet || !c) return c; const n = parseInt(c.slice(1), 16), f = 0.85;
  return `rgb(${(n >> 16) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`; };
const center = path(T.center, true), left = path(T.left, true), right = path(T.right, true);
const curbs = T.curbs.map(c => path(c, false));
const runoff = T.runoff.map(r => ({ gravel: r.gravel, mid: path(r.mid, false), wall: path(r.wall, false) }));
const armco = T.armco.map(a => path(a, false));
const trees = new Path2D(), crowns = new Path2D(), Tr = S.scenery.trees;
for (let i = 0; i < Tr.x.length; i++) {
  trees.moveTo(Tr.x[i] + Tr.r[i], Tr.y[i]); trees.arc(Tr.x[i], Tr.y[i], Tr.r[i], 0, 2 * Math.PI);
  const r = Tr.r[i] * 0.45; crowns.moveTo(Tr.x[i] - 1 + r, Tr.y[i] + 1); crowns.arc(Tr.x[i] - 1, Tr.y[i] + 1, r, 0, 2 * Math.PI);
}

// One set of tyres: its laps back to back, then the change at the line; the cycle repeats.
// Linear interpolation between simulation samples.
const L = S.laps, starts = [];
let stintTime = 0;
for (const l of L) { starts.push(stintTime); stintTime += l.time; }
const cycle = stintTime + S.change_s, lastLap = L[L.length - 1];
function stateAt(time) {
  const c = Math.floor(time / cycle), tc = time - c * cycle, done = c * L.length;
  if (tc >= stintTime) {  // stopped at the line for new tyres
    const n = F.x.length - 1;
    return { lap: done + L.length, t: lastLap.time, x: F.x[n], y: F.y[n], h: F.h[n], v: 0, tyres: lastLap.d1,
             last: lastLap.time, change: tc - stintTime };
  }
  let k = 0;
  while (k + 1 < L.length && starts[k + 1] <= tc) k++;
  const l = L[k], t = tc - starts[k];
  let lo = 0, hi = l.t.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (l.t[mid] <= t) lo = mid; else hi = mid; }
  const f = (t - l.t[lo]) / (l.t[hi] - l.t[lo] || 1), mix = a => a[lo] + (a[hi] - a[lo]) * f;
  return { lap: done + k + 1, t, x: mix(F.x), y: mix(F.y), h: mix(F.h), v: mix(l.v), tyres: l.d0 + (l.d1 - l.d0) * t / l.time,
           last: k > 0 ? L[k - 1].time : c > 0 ? lastLap.time : null, change: null };
}

// ---- Car parts (local frame: +x forward, +y left, metres) ----
const BODY = { kart: { L: 3.2, W: 1.9, open: true }, comet: { L: 4.6, W: 1.95 }, bulldog: { L: 5.4, W: 2.3 }, feather: { L: 3.0, W: 1.7, open: true } };
const WHEEL = { standard: { l: 0.7, w: 0.32 }, slick: { l: 0.75, w: 0.46 }, monster: { l: 1.15, w: 0.62 }, roller: { l: 0.45, w: 0.26 } };
const body = BODY[S.car.body] || BODY.kart, wheel = WHEEL[S.car.wheels] || WHEEL.standard, color = S.car.color;

function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function helmet(x) {
  ctx.beginPath(); ctx.arc(x, 0, 0.34, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 0.05; ctx.strokeStyle = '#000'; ctx.stroke();
  rect(x + 0.08, -0.2, 0.18, 0.4, '#111');  // visor faces forward
}
function drawWheels(L, B) {
  const y = body.open ? B / 2 : B / 2 - wheel.w * 0.3;
  for (const x of [L * 0.32, -L * 0.3]) for (const side of [-1, 1]) {
    const cx = x - wheel.l / 2, cy = side * y - wheel.w / 2;
    rect(cx, cy, wheel.l, wheel.w, '#111');
    rect(cx, side > 0 ? cy + wheel.w - 0.06 : cy, wheel.l, 0.06, S.car.tyre_color);  // sidewall colour of the tyre fitted
    if (S.car.wheels === 'monster') for (let k = 1; k < 6; k++) rect(cx + k * wheel.l / 6 - 0.03, cy, 0.06, wheel.w, '#3a3a3a');
    if (S.car.wheels === 'standard') rect(x - 0.12, side * y - 0.08, 0.24, 0.16, '#9a9a9a');
    if (S.car.wheels === 'roller') { ctx.beginPath(); ctx.arc(x, side * y, 0.1, 0, 2 * Math.PI); ctx.fillStyle = '#fff'; ctx.fill(); }
  }
}
function drawEngine(L, B, running) {
  const rear = -L / 2;
  if (S.car.engine === 'electric') { rect(rear - 0.05, -B * 0.3, 0.12, B * 0.6, '#33c3ff'); return; }
  const pipes = S.car.engine === 'turbo' ? [-0.25, 0.25] : [0];
  const len = S.car.engine === 'light' ? 0.2 : 0.35;
  for (const y of pipes) {
    rect(rear - len, y - 0.07, len, 0.14, '#777');
    if (S.car.engine === 'turbo' && running) {  // flame flickers only while the sim runs
      const f = 0.4 + 0.3 * Math.abs(Math.sin(performance.now() / 40 + y * 9));
      ctx.beginPath(); ctx.moveTo(rear - len, y - 0.09); ctx.lineTo(rear - len - f, y); ctx.lineTo(rear - len, y + 0.09);
      ctx.fillStyle = '#ff9a1f'; ctx.fill();
    }
  }
}
function drawBody(L, B) {
  ctx.lineWidth = 0.06; ctx.strokeStyle = '#000';
  if (S.car.body === 'kart') {
    rect(-L / 2 + 0.25, -B * 0.28, L - 0.7, B * 0.56, color); ctx.strokeRect(-L / 2 + 0.25, -B * 0.28, L - 0.7, B * 0.56);
    rect(L / 2 - 0.45, -B * 0.45, 0.25, B * 0.9, '#222');                     // front bumper
    rect(-0.3, -B * 0.42, 1.0, 0.18, color); rect(-0.3, B * 0.42 - 0.18, 1.0, 0.18, color);  // side pods
    rect(-0.75, -0.3, 0.6, 0.6, '#222'); helmet(-0.45);
    rect(0.15, -0.25, 0.08, 0.5, '#222');                                      // steering wheel
  } else if (S.car.body === 'comet') {
    ctx.beginPath();
    ctx.moveTo(-L / 2, -B * 0.42); ctx.lineTo(L / 2 - 0.8, -B * 0.42); ctx.quadraticCurveTo(L / 2, -B * 0.3, L / 2, 0);
    ctx.quadraticCurveTo(L / 2, B * 0.3, L / 2 - 0.8, B * 0.42); ctx.lineTo(-L / 2, B * 0.42); ctx.closePath();
    ctx.fillStyle = color; ctx.fill(); ctx.stroke();
    rect(0.2, -B * 0.3, 0.9, B * 0.6, 'rgba(0,0,0,.75)'); rect(-1.6, -B * 0.28, 0.5, B * 0.56, 'rgba(0,0,0,.75)');
    rect(-L / 2 - 0.1, -B * 0.45, 0.3, B * 0.9, '#222');                      // rear wing
  } else if (S.car.body === 'bulldog') {
    rect(-L / 2, -B * 0.46, L - 1.9, B * 0.92, color); ctx.strokeRect(-L / 2, -B * 0.46, L - 1.9, B * 0.92);
    rect(-L / 2, -B * 0.46, L - 1.9, B * 0.92, 'rgba(0,0,0,.25)');            // bed, darker
    for (let k = 1; k < 5; k++) rect(-L / 2 + k * (L - 1.9) / 5, -B * 0.4, 0.06, B * 0.8, 'rgba(0,0,0,.35)');
    rect(L / 2 - 1.8, -B * 0.46, 1.8, B * 0.92, color); ctx.strokeRect(L / 2 - 1.8, -B * 0.46, 1.8, B * 0.92);
    rect(L / 2 - 0.9, -B * 0.38, 0.45, B * 0.76, 'rgba(0,0,0,.75)');          // windscreen
    rect(L / 2, -B * 0.42, 0.18, B * 0.84, '#222');                           // bull bar
  } else {  // feather: tube frame
    ctx.lineWidth = 0.12; ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(-L / 2 + 0.2, -B * 0.3); ctx.lineTo(L / 2 - 0.2, -B * 0.15); ctx.lineTo(L / 2 - 0.2, B * 0.15);
    ctx.lineTo(-L / 2 + 0.2, B * 0.3); ctx.closePath(); ctx.moveTo(-0.2, -B * 0.25); ctx.lineTo(-0.2, B * 0.25); ctx.stroke();
    rect(-0.7, -0.28, 0.55, 0.56, '#222'); helmet(-0.42);
  }
}
function drawCar(s, scale, running) {
  ctx.save();
  ctx.translate(s.x, s.y); ctx.rotate(s.h);
  const k = $('view').value === 'overview' ? Math.max(1, 24 / (body.L * scale)) : 1;
  ctx.scale(k, k);  // overview only: enlarged so the car stays visible
  rect(-body.L / 2 + 0.15, -body.W / 2 - 0.05, body.L, body.W + 0.1, 'rgba(0,0,0,.25)');  // shadow
  drawEngine(body.L, body.W, running);
  drawWheels(body.L, body.W);
  drawBody(body.L, body.W);
  if (s.change !== null) {  // tyre change: a crew member at each wheel
    ctx.fillStyle = '#ff5a36'; ctx.strokeStyle = '#000'; ctx.lineWidth = 0.08;
    for (const fx of [0.3, -0.3]) for (const side of [1, -1]) {
      ctx.beginPath(); ctx.arc(fx * body.L, side * (body.W / 2 + 0.55), 0.32, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
}

// ---- Track and surroundings ----
function drawGround() {
  const [x0, y0, x1, y1] = S.bounds, band = 24;
  ctx.fillStyle = shade(THEME.ground); ctx.fillRect(x0 - 4000, y0 - 4000, x1 - x0 + 8000, y1 - y0 + 8000);
  if (THEME.stripe) {  // mown stripes
    ctx.fillStyle = shade(THEME.stripe);
    for (let x = x0; x < x1; x += 2 * band) ctx.fillRect(x, y0, band, y1 - y0);
  }
  if (HB) drawSea();
}
const hash = n => { const v = Math.sin(n) * 43758.5453; return v - Math.floor(v); };
// ---- Harbour: sea, quay, piers, yachts, pool, city blocks, tunnel roof (world metres) ----
const HB = S.scenery.harbour && S.scenery.harbour.sea ? S.scenery.harbour : null;
const sea = HB && path(HB.sea, true), quay = HB && path(HB.quay, false), tunnel = HB && path(HB.tunnel, false);
const waves = [];
if (HB) {
  const [x0, y0, x1, y1] = S.bounds;
  for (let i = 0; i < 900; i++) waves.push([x0 + hash(i * 3.17 + 1) * (x1 - x0), y0 + hash(i * 7.91 + 2) * (y1 - y0), 2 + hash(i * 1.3) * 5]);
}
function drawSea() {
  ctx.fillStyle = shade('#1b5a85'); ctx.fill(sea);
  ctx.save(); ctx.clip(sea);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = shade('#24709e'); ctx.lineWidth = 70; ctx.stroke(quay);   // shallower water near the quay
  ctx.strokeStyle = shade('#2f82b0'); ctx.lineWidth = 28; ctx.stroke(quay);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 0.5; ctx.beginPath();
  for (const [x, y, l] of waves) { ctx.moveTo(x, y); ctx.quadraticCurveTo(x + l / 2, y + 0.8, x + l, y); }
  ctx.stroke();
  ctx.restore();
  ctx.lineCap = 'butt';
  ctx.strokeStyle = '#ece5d6'; ctx.lineWidth = 2.2; ctx.stroke(quay);          // stone quay edge
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 0.5; ctx.stroke(quay);
}
function drawHarbour() {
  if (!HB) return;
  const bw = path(HB.breakwater, false), n = HB.breakwater.x.length - 1;
  ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 14; ctx.stroke(bw);  // surf on the rocks
  ctx.strokeStyle = '#8c8577'; ctx.lineWidth = 9; ctx.stroke(bw);
  ctx.strokeStyle = '#c9c1b0'; ctx.lineWidth = 5; ctx.stroke(bw);
  ctx.beginPath(); ctx.arc(HB.breakwater.x[n], HB.breakwater.y[n], 3.2, 0, 2 * Math.PI); ctx.fillStyle = '#c8102e'; ctx.fill();  // harbour light
  ctx.lineCap = 'butt';
  for (const pr of HB.piers) {
    const p = path(pr, false);
    ctx.lineCap = 'butt'; ctx.strokeStyle = '#6d5f49'; ctx.lineWidth = 3.6; ctx.stroke(p);
    ctx.strokeStyle = '#cdb994'; ctx.lineWidth = 2.6; ctx.stroke(p);
  }
  const Y = HB.yachts;
  for (let i = 0; i < Y.x.length; i++) {
    const l = Y.l[i], w = l * 0.3;
    ctx.save(); ctx.translate(Y.x[i], Y.y[i]); ctx.rotate(Y.a[i]);
    const hull = new Path2D();
    hull.moveTo(l / 2, 0); hull.bezierCurveTo(l / 4, w / 2, -l / 4, w / 2, -l / 2, w * 0.42);
    hull.lineTo(-l / 2, -w * 0.42); hull.bezierCurveTo(-l / 4, -w / 2, l / 4, -w / 2, l / 2, 0); hull.closePath();
    ctx.save(); ctx.translate(0.8, -0.8); ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill(hull); ctx.restore();   // shadow on the water
    ctx.fillStyle = '#fbfbf8'; ctx.fill(hull); ctx.strokeStyle = '#8796a2'; ctx.lineWidth = 0.25; ctx.stroke(hull);
    rect(-l / 2 + 0.6, -w * 0.3, l * 0.22, w * 0.6, '#b98d5c');                 // teak aft deck
    rect(-l * 0.22, -w * 0.28, l * 0.42, w * 0.56, '#e6eaee');                  // superstructure
    rect(l * 0.12, -w * 0.24, l * 0.06, w * 0.48, '#2d3e4c');                   // windscreen
    if (l > 30) rect(-l * 0.12, -w * 0.18, l * 0.2, w * 0.36, '#d3d9de');       // upper deck
    ctx.restore();
  }
  // Swimming pool on the quay.
  const P = path(HB.pool, true);
  ctx.fillStyle = '#e9e4d8'; ctx.fill(P);
  ctx.save(); ctx.clip(P);
  ctx.strokeStyle = '#4cc3ea'; ctx.lineWidth = 18; ctx.lineJoin = 'miter'; ctx.stroke(P);
  ctx.restore();
  ctx.fillStyle = '#3fb7e3';
  ctx.beginPath(); const px = HB.pool.x, py = HB.pool.y, inset = 0.18;
  const lerp = (a, b, t) => a + (b - a) * t, cx = (px[0] + px[1] + px[2] + px[3]) / 4, cy = (py[0] + py[1] + py[2] + py[3]) / 4;
  for (let i = 0; i < 4; i++) { const x = lerp(px[i], cx, inset * 2), y = lerp(py[i], cy, inset * 2); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.3; ctx.beginPath();
  for (let k = 1; k < 6; k++) {
    const t = k / 6, ax = lerp(lerp(px[0], cx, .36), lerp(px[3], cx, .36), t), ay = lerp(lerp(py[0], cy, .36), lerp(py[3], cy, .36), t);
    const bx = lerp(lerp(px[1], cx, .36), lerp(px[2], cx, .36), t), by = lerp(lerp(py[1], cy, .36), lerp(py[2], cy, .36), t);
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  }
  ctx.stroke();
  // City blocks, squared to the street, with a drop shadow.
  const B = HB.blocks, roofs = ['#d9cdb8', '#c98f6b', '#ece7dd', '#b9b2a6', '#d7b48c', '#f1ede4'];
  for (let i = 0; i < B.x.length; i++) {
    ctx.save(); ctx.translate(B.x[i], B.y[i]); ctx.rotate(B.a[i]);
    const w = B.w[i], h = B.h[i];
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(-w / 2 + 2, -h / 2 - 2, w, h);
    ctx.fillStyle = shade(roofs[i % roofs.length]); ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.strokeStyle = 'rgba(60,50,40,.55)'; ctx.lineWidth = 0.5; ctx.strokeRect(-w / 2, -h / 2, w, h);
    if (i % 3 === 0) { ctx.strokeStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.stroke(); }  // roof ridge
    if (i % 5 === 1) rect(-w * 0.15, -h * 0.15, w * 0.3, h * 0.3, 'rgba(255,255,255,.35)');                                       // rooftop plant room
    ctx.restore();
  }
}
function drawTunnelRoof() {
  if (!HB) return;
  ctx.save();
  if ($('view').value === 'follow') ctx.globalAlpha = 0.35;  // see the car through the roof when following it
  ctx.lineCap = 'butt';
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = T.width + 26; ctx.stroke(tunnel);
  ctx.strokeStyle = shade('#d6cebf'); ctx.lineWidth = T.width + 22; ctx.stroke(tunnel);   // the hotel built over the tunnel
  ctx.strokeStyle = shade('#c4bbaa'); ctx.lineWidth = T.width + 8; ctx.stroke(tunnel);
  ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = T.width + 2; ctx.stroke(tunnel); ctx.setLineDash([]);
  ctx.restore();
}
function drawBuildings() {
  for (const b of S.scenery.buildings) {
    const p = path(b, true);
    ctx.fillStyle = b.kind === 'pits' ? '#d9d9d9' : '#bfbfbf'; ctx.fill(p);
    ctx.lineWidth = 0.6; ctx.strokeStyle = '#222'; ctx.stroke(p);
    // Rows: seats on the grandstand, garage doors on the pits.
    const n = b.kind === 'pits' ? 10 : 6;
    ctx.beginPath();
    for (let i = 1; i < n; i++) {
      const f = i / n;
      if (b.kind === 'pits') { ctx.moveTo(b.x[0] + (b.x[1] - b.x[0]) * f, b.y[0] + (b.y[1] - b.y[0]) * f); ctx.lineTo(b.x[3] + (b.x[2] - b.x[3]) * f, b.y[3] + (b.y[2] - b.y[3]) * f); }
      else { ctx.moveTo(b.x[0] + (b.x[3] - b.x[0]) * f, b.y[0] + (b.y[3] - b.y[0]) * f); ctx.lineTo(b.x[1] + (b.x[2] - b.x[1]) * f, b.y[1] + (b.y[2] - b.y[1]) * f); }
    }
    ctx.lineWidth = b.kind === 'pits' ? 0.4 : 1.2; ctx.strokeStyle = b.kind === 'pits' ? '#555' : '#8c2a2a'; ctx.stroke();
  }
}
function draw(s, running) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const follow = $('view').value === 'follow';
  const scale = follow ? S.follow_scale : S.camera.scale;
  const ox = follow ? W / 2 - scale * s.x : S.camera.ox, oy = follow ? H / 2 + scale * s.y : S.camera.oy;
  ctx.setTransform(dpr * scale, 0, 0, -dpr * scale, dpr * ox, dpr * oy);  // world metres, +y up
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt'; ctx.setLineDash([]);
  drawGround();
  for (const r of runoff) {
    ctx.lineWidth = T.runoff_width; ctx.strokeStyle = r.gravel ? (wet ? '#b8a46e' : '#d8c48e') : (wet ? '#4a4c50' : '#5c5d60'); ctx.stroke(r.mid);
    ctx.lineWidth = 1.2; ctx.strokeStyle = '#1b1b1b'; ctx.stroke(r.wall);                          // tyre wall
    ctx.setLineDash([2, 2]); ctx.lineWidth = 0.5; ctx.strokeStyle = '#c8102e'; ctx.stroke(r.wall); ctx.setLineDash([]);
  }
  ctx.lineWidth = 0.5; ctx.strokeStyle = '#c9ccd1'; for (const a of armco) ctx.stroke(a);          // guardrail
  ctx.setLineDash([0.25, 3.75]); ctx.lineWidth = 1.0; ctx.strokeStyle = '#55595f'; for (const a of armco) ctx.stroke(a); ctx.setLineDash([]);  // posts
  drawHarbour();
  drawBuildings();
  ctx.strokeStyle = shade(THEME.verge); ctx.lineWidth = T.width + 3; ctx.stroke(center);                      // track verge
  ctx.strokeStyle = wet ? '#2b2e33' : '#3a3a3c'; ctx.lineWidth = T.width; ctx.stroke(center);        // asphalt, darker when wet
  ctx.lineWidth = T.curb_width;
  for (const c of curbs) {
    ctx.setLineDash([]); ctx.strokeStyle = '#fff'; ctx.stroke(c);
    ctx.setLineDash([1.5, 1.5]); ctx.strokeStyle = '#c8102e'; ctx.stroke(c);
  }
  ctx.setLineDash([]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.25; ctx.stroke(left); ctx.stroke(right);
  ctx.save();  // chequered start/finish line across the track
  ctx.translate(T.start.x, T.start.y); ctx.rotate(T.start.h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < Math.ceil(T.width); j++) rect(i - 1, j - T.width / 2, 1, Math.min(1, T.width - j), (i + j) % 2 ? '#000' : '#fff');
  ctx.restore();
  ctx.fillStyle = shade(THEME.tree); ctx.fill(trees); ctx.fillStyle = shade(THEME.crown); ctx.fill(crowns);
  drawCar(s, scale, running);
  drawTunnelRoof();
  drawRain();
}

// Rain overlay in screen space; drops move with wall-clock time, independent of the car.
const drops = Array.from({ length: Math.round(260 * wet) }, (_, i) => [hash(i * 12.9898) * W, hash(i * 78.233) * H]);
function drawRain() {
  if (!drops.length) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgba(30, 45, 60, ${0.22 * wet})`; ctx.fillRect(0, 0, W, H);
  const fall = (performance.now() / 1000 * 900) % H;
  ctx.strokeStyle = 'rgba(210, 225, 240, 0.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (const [x, y] of drops) { const yy = (y + fall) % H, xx = (x + yy * 0.25) % W; ctx.moveTo(xx, yy); ctx.lineTo(xx - 4, yy - 16); }
  ctx.stroke();
}

const $ = id => document.getElementById(id);
let simTime = 0, running = false, last = null;
function hud(s, status) {
  $('speed').textContent = (s.v * 3.6).toFixed(0) + ' km/h';
  $('lap').textContent = s.lap;
  $('laptime').textContent = s.t.toFixed(2) + ' s';
  $('last').textContent = s.last === null ? '—' : s.last.toFixed(2) + ' s';
  $('tyres').textContent = Math.round(s.tyres * 100) + '%';
  $('tyrebar').style.width = (s.tyres * 100).toFixed(1) + '%';
  $('tyrename').textContent = S.car.tyre;
  $('tyrebar').style.background = s.tyres <= 0.3 ? '#ff5a36' : S.car.tyre_color;
  $('status').textContent = s.change !== null && running ? `Tyre change ${Math.max(0, S.change_s - s.change).toFixed(1)} s` : status;
  $('weather').textContent = S.weather.name;
}
function frame(now) {
  if (running) { simTime += (now - last) / 1000 * parseFloat($('mult').value); last = now; }
  const s = stateAt(simTime);
  draw(s, running); hud(s, running ? 'Running' : simTime > 0 ? 'Paused' : 'Ready');
  if (running) requestAnimationFrame(frame);
}
$('start').onclick = () => { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } };
$('pause').onclick = () => { running = false; requestAnimationFrame(frame); };
$('reset').onclick = () => { running = false; simTime = 0; requestAnimationFrame(frame); };
$('view').onchange = () => requestAnimationFrame(frame);
requestAnimationFrame(frame);
</script>
</body>
</html>
